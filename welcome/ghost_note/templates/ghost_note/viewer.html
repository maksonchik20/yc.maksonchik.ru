<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Note — {{ session_id }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header .session { font-size: 0.85rem; color: #94a3b8; word-break: break-all; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .screen-wrap {
      flex: 1;
      background: #0f0f1a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      border: 1px solid #334155;
    }
    .screen-wrap img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }
    .screen-wrap .placeholder { color: #64748b; padding: 16px; text-align: center; }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    textarea {
      flex: 1;
      min-width: 200px;
      min-height: 80px;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
    }
    button {
      padding: 10px 20px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .status { font-size: 0.85rem; color: #94a3b8; }
    .note { font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>Ghost Note</h1>
    <span class="session">Сессия: {{ session_id }}</span>
  </header>
  <main>
    <div class="screen-wrap">
      <img id="screen" alt="Экран" style="display:none">
      <span id="placeholder" class="placeholder">Ожидание скриншота…</span>
    </div>
    <div class="controls">
      <textarea id="text" placeholder="Текст для окна на ПК…"></textarea>
      <button type="button" id="send">Отправить</button>
    </div>
    <div class="btn-row">
      <button type="button" id="audioBtn" class="secondary">Включить звук</button>
    </div>
    <p class="status" id="status">Обновление каждые 2 с</p>
    <p class="note">Ctrl+Enter — отправить. Звук транслируется с ПК по WebSocket.</p>
  </main>
  <script>
    const SESSION_ID = '{{ session_id }}';
    const screenImg = document.getElementById('screen');
    const placeholder = document.getElementById('placeholder');
    const textArea = document.getElementById('text');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const audioBtn = document.getElementById('audioBtn');

    async function refreshScreenshot() {
      try {
        const r = await fetch('/ghost/screenshot/get/?session_id=' + encodeURIComponent(SESSION_ID), {
          cache: 'no-store'
        });
        if (r.status === 204) return;
        if (!r.ok) throw new Error(r.status);
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        screenImg.onload = () => URL.revokeObjectURL(url);
        screenImg.src = url;
        screenImg.style.display = 'block';
        placeholder.style.display = 'none';
      } catch (e) {
        statusEl.textContent = 'Ошибка загрузки скриншота';
      }
    }

    async function sendText() {
      const text = textArea.value;
      if (!text.trim()) return;
      sendBtn.disabled = true;
      try {
        const r = await fetch('/ghost/text/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: SESSION_ID, text: text })
        });
        if (!r.ok) throw new Error(r.status);
        statusEl.textContent = 'Текст отправлен';
      } catch (e) {
        statusEl.textContent = 'Ошибка отправки текста';
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendText);
    textArea.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') sendText();
    });

    refreshScreenshot();
    setInterval(refreshScreenshot, 2000);

    let audioOn = false;
    let audioWs = null;
    let audioCtx = null;
    let audioNode = null;
    let audioPush = null;
    let audioCh = 2;
    let audioRate = 48000;
    let audioReady = false;
    let audioQueue = [];

    function resampleInterleaved(input, srcRate, dstRate, channels) {
      if (srcRate === dstRate || !input.length) return input;
      const inFrames = input.length / channels;
      const outFrames = Math.max(1, Math.round(inFrames * dstRate / srcRate));
      const out = new Float32Array(outFrames * channels);
      for (let i = 0; i < outFrames; i++) {
        const srcPos = i * srcRate / dstRate;
        const i0 = Math.min(Math.floor(srcPos), inFrames - 1);
        const i1 = Math.min(i0 + 1, inFrames - 1);
        const frac = srcPos - i0;
        for (let c = 0; c < channels; c++) {
          const s0 = input[i0 * channels + c];
          const s1 = input[i1 * channels + c];
          out[i * channels + c] = s0 + (s1 - s0) * frac;
        }
      }
      return out;
    }

    function createAudioRing(capacity) {
      const buf = new Float32Array(capacity);
      let write = 0;
      let read = 0;
      let count = 0;
      return {
        reset() {
          write = read = count = 0;
        },
        available() {
          return count;
        },
        skip(samples) {
          const drop = Math.min(samples, count);
          read = (read + drop) % capacity;
          count -= drop;
        },
        push(data) {
          for (let i = 0; i < data.length; i++) {
            if (count >= capacity) {
              read = (read + 1) % capacity;
              count--;
            }
            buf[write] = data[i];
            write = (write + 1) % capacity;
            count++;
          }
        },
        readInto(target, samples) {
          const got = Math.min(samples, count);
          for (let i = 0; i < got; i++) {
            target[i] = buf[read];
            read = (read + 1) % capacity;
          }
          count -= got;
          return got;
        }
      };
    }

    function sameAudioConfig(rate, channels) {
      return audioCtx && audioReady &&
        audioRate === (rate || 48000) && audioCh === (channels || 2);
    }

    async function initAudioPipeline(rate, channels) {
      const nextRate = rate || 48000;
      const nextCh = channels || 2;
      if (sameAudioConfig(nextRate, nextCh)) return;
      if (audioCtx) {
        try { await audioCtx.close(); } catch (e) {}
        audioCtx = null;
        audioNode = null;
        audioPush = null;
      }
      audioRate = nextRate;
      audioCh = nextCh;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: audioRate });
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      const streamRate = audioRate;
      const ctxRate = audioCtx.sampleRate;
      const samplesMs = (ms) => Math.floor(ctxRate * audioCh * ms / 1000);
      const ring = createAudioRing(samplesMs(400));
      let playPrimed = false;
      const primedSamples = () => samplesMs(80);
      const targetBuffered = () => samplesMs(120);
      const maxBuffered = () => samplesMs(200);
      audioPush = (ab) => {
        let f32 = new Float32Array(ab);
        if (!f32.length) return;
        if (streamRate !== ctxRate) {
          f32 = resampleInterleaved(f32, streamRate, ctxRate, audioCh);
        }
        ring.push(f32);
        const avail = ring.available();
        if (avail > maxBuffered()) {
          ring.skip(avail - targetBuffered());
        }
      };
      const bufferSize = 2048;
      const scratch = new Float32Array(bufferSize * audioCh);
      audioNode = audioCtx.createScriptProcessor(bufferSize, 0, audioCh);
      audioNode.onaudioprocess = (e) => {
        const out = e.outputBuffer;
        const ch = out.numberOfChannels;
        const frames = out.length;
        const need = frames * ch;
        const outs = [];
        for (let c = 0; c < ch; c++) outs.push(out.getChannelData(c));
        if (!playPrimed) {
          if (ring.available() < primedSamples()) {
            for (let c = 0; c < ch; c++) outs[c].fill(0);
            return;
          }
          playPrimed = true;
        }
        const avail = ring.available();
        if (avail > maxBuffered()) {
          ring.skip(avail - targetBuffered());
        }
        const got = ring.readInto(scratch, need);
        for (let i = 0; i < frames; i++) {
          for (let c = 0; c < ch; c++) {
            const idx = i * ch + c;
            outs[c][i] = idx < got ? scratch[idx] : 0;
          }
        }
      };
      audioNode.connect(audioCtx.destination);
    }

    async function stopAudio() {
      audioOn = false;
      audioReady = false;
      audioQueue = [];
      audioPush = null;
      if (audioWs) {
        try { audioWs.close(); } catch (e) {}
        audioWs = null;
      }
      if (audioCtx) {
        try {
          if (audioNode) {
            audioNode.onaudioprocess = null;
            audioNode.disconnect();
            audioNode = null;
          }
          await audioCtx.close();
        } catch (e) {}
        audioCtx = null;
      }
      audioBtn.textContent = 'Включить звук';
    }

    async function startAudio() {
      const r = await fetch('/ghost/audio/on/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID })
      });
      if (!r.ok) throw new Error(r.status);

      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      audioWs = new WebSocket(
        proto + '//' + location.host + '/ghost/audio/ws/?session_id=' +
        encodeURIComponent(SESSION_ID) + '&role=listen'
      );
      audioWs.binaryType = 'arraybuffer';
      audioOn = true;
      audioReady = false;
      audioQueue = [];
      audioBtn.textContent = 'Выключить звук';
      statusEl.textContent = 'Ожидание звука с ПК…';

      audioWs.onmessage = async (ev) => {
        if (typeof ev.data === 'string') {
          try {
            const cfg = JSON.parse(ev.data);
            if (sameAudioConfig(cfg.rate || 48000, cfg.channels || 2)) {
              return;
            }
            await initAudioPipeline(cfg.rate || 48000, cfg.channels || 2);
            audioReady = true;
            if (audioPush) {
              for (const buf of audioQueue) audioPush(buf);
            }
            audioQueue = [];
            statusEl.textContent = 'Конфигурация получена, ожидание потока…';
          } catch (e) {
            statusEl.textContent = 'Ошибка инициализации звука';
            await stopAudio();
          }
          return;
        }
        if (!audioOn) return;
        if (!audioReady || !audioPush) {
          await initAudioPipeline(48000, 2);
          audioReady = true;
          statusEl.textContent = 'Звук включён';
        }
        if (!audioPush) {
          audioQueue.push(ev.data.slice(0));
          return;
        }
        audioPush(ev.data);
      };

      audioWs.onopen = () => {
        statusEl.textContent = 'WebSocket подключён, ожидание ПК…';
      };

      audioWs.onclose = () => {
        if (audioOn) {
          statusEl.textContent = 'Соединение звука разорвано';
          stopAudio();
        }
      };

      audioWs.onerror = () => {
        statusEl.textContent = 'Ошибка WebSocket';
      };
    }

    audioBtn.addEventListener('click', async () => {
      try {
        if (audioOn) {
          await fetch('/ghost/audio/off/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: SESSION_ID })
          });
          await stopAudio();
        } else {
          await startAudio();
        }
      } catch (e) {
        statusEl.textContent = 'Ошибка управления звуком';
        await stopAudio();
      }
    });
  </script>
</body>
</html>

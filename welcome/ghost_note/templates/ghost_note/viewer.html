<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Note — {{ session_id }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header .session { font-size: 0.85rem; color: #94a3b8; word-break: break-all; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .screen-wrap {
      flex: 1;
      background: #0f0f1a;
      border-radius: 8px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: none;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 300px;
      max-height: 70vh;
      border: 1px solid #334155;
    }
    .screen-wrap img {
      display: block;
      margin: 0 auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .screen-wrap .placeholder {
      color: #64748b;
      padding: 16px;
      text-align: center;
      margin: auto;
    }
    .screen-zoom-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .screen-zoom-controls .zoom-label {
      min-width: 52px;
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .screen-zoom-controls button {
      min-width: 44px;
      padding: 8px 14px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    textarea {
      flex: 1;
      min-width: 200px;
      min-height: 80px;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
    }
    button {
      padding: 10px 20px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #2563eb; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary:disabled { background: #334155; color: #94a3b8; }
    button.secondary:disabled:hover { background: #334155; }
    .status { font-size: 0.85rem; color: #94a3b8; }
    .note { font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>Ghost Note</h1>
    <span class="session">Сессия: {{ session_id }}</span>
  </header>
  <main>
    <div class="screen-wrap" id="screenWrap">
      <img id="screen" alt="Экран" style="display:none">
      <span id="placeholder" class="placeholder">Ожидание скриншота…</span>
    </div>
    <div class="screen-zoom-controls">
      <button type="button" id="zoomOut" class="secondary" aria-label="Уменьшить">−</button>
      <span id="zoomLabel" class="zoom-label">100%</span>
      <button type="button" id="zoomIn" class="secondary" aria-label="Увеличить">+</button>
      <button type="button" id="zoomReset" class="secondary">Сброс</button>
    </div>
    <div class="controls">
      <textarea id="text" placeholder="Текст для окна на ПК…"></textarea>
      <button type="button" id="send">Отправить</button>
    </div>
    <div class="btn-row">
      <button type="button" id="audioBtn" class="secondary">Включить звук</button>
    </div>
    <p class="status" id="status">Обновление каждые 2 с</p>
    <p class="note">⌘/Ctrl + +/− — масштаб экрана. Pinch, колёсико или кнопки ±. Ctrl+Enter — отправить.</p>
  </main>
  <script>
    function initScreenZoom(wrap, img) {
      let userScale = 1;
      let baseFit = 1;
      let pinchStartDist = 0;
      let pinchStartScale = 1;
      let pinchActive = false;
      let lastTap = 0;
      const minUser = 1;
      const maxUser = 5;
      const zoomOut = document.getElementById('zoomOut');
      const zoomIn = document.getElementById('zoomIn');
      const zoomReset = document.getElementById('zoomReset');
      const zoomLabel = document.getElementById('zoomLabel');

      function updateLabel() {
        if (zoomLabel) zoomLabel.textContent = Math.round(userScale * 100) + '%';
      }

      function applyLayout() {
        if (!img.naturalWidth || img.style.display === 'none') return;
        const availW = Math.max(1, wrap.clientWidth);
        const availH = Math.max(1, wrap.clientHeight);
        baseFit = Math.min(1, availW / img.naturalWidth, availH / img.naturalHeight);
        if (!isFinite(baseFit) || baseFit <= 0) baseFit = 1;
        img.style.width = (img.naturalWidth * baseFit * userScale) + 'px';
        img.style.height = 'auto';
        updateLabel();
      }

      function setUserScale(next) {
        userScale = Math.min(maxUser, Math.max(minUser, next));
        applyLayout();
      }

      img.addEventListener('load', applyLayout);
      window.addEventListener('resize', applyLayout);

      if (zoomIn) zoomIn.addEventListener('click', () => setUserScale(userScale + 0.25));
      if (zoomOut) zoomOut.addEventListener('click', () => setUserScale(userScale - 0.25));
      if (zoomReset) zoomReset.addEventListener('click', () => setUserScale(1));

      function isEditableTarget(el) {
        if (!el || !el.tagName) return false;
        const tag = el.tagName.toLowerCase();
        return tag === 'textarea' || tag === 'input' || tag === 'select' || el.isContentEditable;
      }

      window.addEventListener('keydown', (e) => {
        if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
        if (isEditableTarget(e.target)) return;
        if (img.style.display === 'none') return;

        const code = e.code;
        const key = e.key;
        let handled = false;

        if (code === 'Equal' || code === 'NumpadAdd' || key === '+' || key === '=') {
          setUserScale(userScale + 0.25);
          handled = true;
        } else if (code === 'Minus' || code === 'NumpadSubtract' || key === '-' || key === '_') {
          setUserScale(userScale - 0.25);
          handled = true;
        } else if (code === 'Digit0' || code === 'Numpad0' || key === '0') {
          setUserScale(1);
          handled = true;
        }

        if (handled) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      wrap.addEventListener('wheel', (e) => {
        if (img.style.display === 'none') return;
        e.preventDefault();
        setUserScale(userScale + (e.deltaY < 0 ? 0.15 : -0.15));
      }, { passive: false });

      wrap.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          pinchActive = true;
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          pinchStartScale = userScale;
        }
      }, { passive: true });

      wrap.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 2 || !pinchStartDist) return;
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        setUserScale(pinchStartScale * (dist / pinchStartDist));
      }, { passive: false });

      wrap.addEventListener('touchend', (e) => {
        if (e.touches.length >= 2) return;
        if (pinchActive) {
          if (e.touches.length === 0) pinchActive = false;
          return;
        }
        if (e.changedTouches.length !== 1) return;
        const now = Date.now();
        if (now - lastTap < 320) setUserScale(userScale > 1.05 ? 1 : 2);
        lastTap = now;
      });

      return { applyLayout, reset: () => setUserScale(1) };
    }

    const SESSION_ID = '{{ session_id }}';
    const screenWrap = document.getElementById('screenWrap');
    const screenImg = document.getElementById('screen');
    const screenZoom = initScreenZoom(screenWrap, screenImg);
    const placeholder = document.getElementById('placeholder');
    const textArea = document.getElementById('text');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const audioBtn = document.getElementById('audioBtn');

    async function refreshScreenshot() {
      try {
        const r = await fetch('/ghost/screenshot/get/?session_id=' + encodeURIComponent(SESSION_ID), {
          cache: 'no-store'
        });
        if (r.status === 204) return;
        if (!r.ok) throw new Error(r.status);
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        screenImg.onload = () => {
          URL.revokeObjectURL(url);
          screenZoom.applyLayout();
        };
        screenImg.src = url;
        screenImg.style.display = 'block';
        placeholder.style.display = 'none';
      } catch (e) {
        statusEl.textContent = 'Ошибка загрузки скриншота';
      }
    }

    async function sendText() {
      const text = textArea.value;
      if (!text.trim()) return;
      sendBtn.disabled = true;
      try {
        const r = await fetch('/ghost/text/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: SESSION_ID, text: text })
        });
        if (!r.ok) throw new Error(r.status);
        statusEl.textContent = 'Текст отправлен';
      } catch (e) {
        statusEl.textContent = 'Ошибка отправки текста';
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendText);
    textArea.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') sendText();
    });

    refreshScreenshot();
    setInterval(refreshScreenshot, 2000);

    let audioOn = false;
    let audioWs = null;
    let audioCtx = null;
    let audioNode = null;
    let audioPush = null;
    let audioCh = 2;
    let audioRate = 48000;
    let audioReady = false;
    let audioQueue = [];
    let audioReset = null;
    let audioInitGen = 0;

    function resampleInterleaved(input, srcRate, dstRate, channels) {
      if (srcRate === dstRate || !input.length) return input;
      const inFrames = input.length / channels;
      const outFrames = Math.max(1, Math.round(inFrames * dstRate / srcRate));
      const out = new Float32Array(outFrames * channels);
      for (let i = 0; i < outFrames; i++) {
        const srcPos = i * srcRate / dstRate;
        const i0 = Math.min(Math.floor(srcPos), inFrames - 1);
        const i1 = Math.min(i0 + 1, inFrames - 1);
        const frac = srcPos - i0;
        for (let c = 0; c < channels; c++) {
          const s0 = input[i0 * channels + c];
          const s1 = input[i1 * channels + c];
          out[i * channels + c] = s0 + (s1 - s0) * frac;
        }
      }
      return out;
    }

    function createAudioRing(capacity) {
      const buf = new Float32Array(capacity);
      let write = 0;
      let read = 0;
      let count = 0;
      return {
        reset() { write = read = count = 0; },
        available() { return count; },
        push(data) {
          for (let i = 0; i < data.length; i++) {
            if (count >= capacity) {
              read = (read + 1) % capacity;
              count--;
            }
            buf[write] = data[i];
            write = (write + 1) % capacity;
            count++;
          }
        },
        readInto(target, samples) {
          const got = Math.min(samples, count);
          for (let i = 0; i < got; i++) {
            target[i] = buf[read];
            read = (read + 1) % capacity;
          }
          count -= got;
          return got;
        }
      };
    }

    function makeAudioPushWorklet(node, streamRate, ctxRate, channels) {
      return (ab) => {
        let f32 = new Float32Array(ab);
        if (!f32.length) return;
        if (streamRate !== ctxRate) {
          f32 = resampleInterleaved(f32, streamRate, ctxRate, channels);
        }
        node.port.postMessage(f32);
      };
    }

    const AUDIO_WORKLET_CODE = `
class GhostAudioProcessor extends AudioWorkletProcessor {
  constructor(options) {
    super();
    this.ch = (options.processorOptions && options.processorOptions.channels) || 2;
    this.capacity = Math.max(8192, Math.floor(sampleRate * this.ch * 8.0));
    this.buf = new Float32Array(this.capacity);
    this.w = 0;
    this.r = 0;
    this.count = 0;
    this.primed = false;
    this.primeNeed = Math.floor(sampleRate * this.ch * 2.0);
    this.last = new Float32Array(this.ch);
    this.hasLast = false;
    this.port.onmessage = (e) => {
      const data = e.data;
      if (data && data.cmd === 'stop') {
        this.count = 0;
        this.r = 0;
        this.w = 0;
        this.primed = false;
        this.hasLast = false;
        this.last.fill(0);
        return;
      }
      if (data && data.length) this._push(data);
    };
  }
  _push(data) {
    for (let i = 0; i < data.length; i++) {
      if (this.count >= this.capacity) {
        this.r = (this.r + 1) % this.capacity;
        this.count--;
      }
      this.buf[this.w] = data[i];
      this.w = (this.w + 1) % this.capacity;
      this.count++;
    }
  }
  process(inputs, outputs) {
    const out = outputs[0];
    if (!out || !out.length) return true;
    const ch = out.length;
    const frames = out[0].length;
    if (!this.primed) {
      if (this.count < this.primeNeed) {
        for (let c = 0; c < ch; c++) out[c].fill(0);
        return true;
      }
      this.primed = true;
    }
    for (let i = 0; i < frames; i++) {
      if (this.count >= ch) {
        for (let c = 0; c < ch; c++) {
          const v = this.buf[(this.r + c) % this.capacity];
          out[c][i] = v;
          this.last[c] = v;
        }
        this.hasLast = true;
        this.r = (this.r + ch) % this.capacity;
        this.count -= ch;
      } else if (this.hasLast) {
        for (let c = 0; c < ch; c++) out[c][i] = this.last[c];
      } else {
        for (let c = 0; c < ch; c++) out[c][i] = 0;
      }
    }
    return true;
  }
}
registerProcessor('ghost-audio-processor', GhostAudioProcessor);
`;

    function sameAudioConfig(rate, channels) {
      return audioCtx && audioReady &&
        audioRate === (rate || 48000) && audioCh === (channels || 2);
    }

    async function initAudioPipeline(rate, channels) {
      if (!audioOn) return;
      const initGen = ++audioInitGen;
      const nextRate = rate || 48000;
      const nextCh = channels || 2;
      if (sameAudioConfig(nextRate, nextCh)) return;
      if (audioCtx) {
        try { await audioCtx.close(); } catch (e) {}
        audioCtx = null;
        audioNode = null;
        audioPush = null;
        audioReset = null;
      }
      audioRate = nextRate;
      audioCh = nextCh;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: audioRate });
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      if (!audioOn || initGen !== audioInitGen) {
        try { await audioCtx.close(); } catch (e) {}
        audioCtx = null;
        return;
      }
      const streamRate = audioRate;
      const ctxRate = audioCtx.sampleRate;

      if (audioCtx.audioWorklet) {
        const blob = new Blob([AUDIO_WORKLET_CODE], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        try {
          await audioCtx.audioWorklet.addModule(url);
          URL.revokeObjectURL(url);
          audioNode = new AudioWorkletNode(audioCtx, 'ghost-audio-processor', {
            outputChannelCount: [audioCh],
            processorOptions: { channels: audioCh },
          });
          audioNode.connect(audioCtx.destination);
          audioPush = makeAudioPushWorklet(audioNode, streamRate, ctxRate, audioCh);
          audioReset = () => {
            try { audioNode.port.postMessage({ cmd: 'stop' }); } catch (e) {}
          };
          return;
        } catch (e) {
          URL.revokeObjectURL(url);
        }
      }

      const samplesMs = (ms) => Math.floor(ctxRate * audioCh * ms / 1000);
      const ring = createAudioRing(samplesMs(8000));
      audioReset = () => {
        ring.reset();
        playPrimed = false;
        hasLast = false;
        lastFrame.fill(0);
      };
      let playPrimed = false;
      const primedSamples = () => samplesMs(2000);
      const lastFrame = new Float32Array(audioCh);
      let hasLast = false;
      audioPush = (ab) => {
        let f32 = new Float32Array(ab);
        if (!f32.length) return;
        if (streamRate !== ctxRate) {
          f32 = resampleInterleaved(f32, streamRate, ctxRate, audioCh);
        }
        ring.push(f32);
      };
      const bufferSize = 2048;
      const scratch = new Float32Array(bufferSize * audioCh);
      audioNode = audioCtx.createScriptProcessor(bufferSize, 0, audioCh);
      audioNode.onaudioprocess = (e) => {
        const out = e.outputBuffer;
        const ch = out.numberOfChannels;
        const frames = out.length;
        const need = frames * ch;
        const outs = [];
        for (let c = 0; c < ch; c++) outs.push(out.getChannelData(c));
        if (!playPrimed) {
          if (ring.available() < primedSamples()) {
            for (let c = 0; c < ch; c++) outs[c].fill(0);
            return;
          }
          playPrimed = true;
        }
        const got = ring.readInto(scratch, need);
        for (let i = 0; i < frames; i++) {
          for (let c = 0; c < ch; c++) {
            const idx = i * ch + c;
            if (idx < got) {
              outs[c][i] = scratch[idx];
              lastFrame[c] = scratch[idx];
              hasLast = true;
            } else if (hasLast) {
              outs[c][i] = lastFrame[c];
            } else {
              outs[c][i] = 0;
            }
          }
        }
      };
      audioNode.connect(audioCtx.destination);
    }

    async function stopAudio() {
      audioOn = false;
      audioInitGen++;
      audioReady = false;
      audioQueue = [];
      audioPush = null;
      audioBtn.textContent = 'Включить звук';
      if (audioReset) {
        try { audioReset(); } catch (e) {}
        audioReset = null;
      }
      const ws = audioWs;
      audioWs = null;
      if (ws) {
        ws.onmessage = null;
        ws.onclose = null;
        ws.onerror = null;
        try { ws.close(); } catch (e) {}
      }
      const ctx = audioCtx;
      audioCtx = null;
      const node = audioNode;
      audioNode = null;
      if (node) {
        try {
          if (node.port) {
            try { node.port.postMessage({ cmd: 'stop' }); } catch (e) {}
            node.port.onmessage = null;
          }
          if (node.onaudioprocess) node.onaudioprocess = null;
          node.disconnect();
        } catch (e) {}
      }
      if (ctx) {
        try { await ctx.close(); } catch (e) {}
      }
    }

    async function startAudio() {
      const r = await fetch('/ghost/audio/on/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID })
      });
      if (!r.ok) throw new Error(r.status);

      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      audioWs = new WebSocket(
        proto + '//' + location.host + '/ghost/audio/ws/?session_id=' +
        encodeURIComponent(SESSION_ID) + '&role=listen'
      );
      audioWs.binaryType = 'arraybuffer';
      audioOn = true;
      audioReady = false;
      audioQueue = [];
      audioBtn.textContent = 'Выключить звук';
      statusEl.textContent = 'Ожидание звука с ПК…';

      audioWs.onmessage = async (ev) => {
        if (!audioOn) return;
        if (typeof ev.data === 'string') {
          try {
            const cfg = JSON.parse(ev.data);
            if (sameAudioConfig(cfg.rate || 48000, cfg.channels || 2)) {
              return;
            }
            await initAudioPipeline(cfg.rate || 48000, cfg.channels || 2);
            if (!audioOn) return;
            audioReady = true;
            if (audioPush) {
              for (const buf of audioQueue) audioPush(buf);
            }
            audioQueue = [];
            statusEl.textContent = 'Конфигурация получена, буферизация ~2 с…';
          } catch (e) {
            statusEl.textContent = 'Ошибка инициализации звука';
            await stopAudio();
          }
          return;
        }
        if (!audioOn) return;
        if (!audioReady || !audioPush) {
          await initAudioPipeline(48000, 2);
          audioReady = true;
          statusEl.textContent = 'Звук включён';
        }
        if (!audioPush) {
          audioQueue.push(ev.data.slice(0));
          return;
        }
        audioPush(ev.data);
      };

      audioWs.onopen = () => {
        statusEl.textContent = 'WebSocket подключён, ожидание ПК…';
      };

      audioWs.onclose = () => {
        if (audioOn) {
          statusEl.textContent = 'Соединение звука разорвано';
          stopAudio();
        }
      };

      audioWs.onerror = () => {
        statusEl.textContent = 'Ошибка WebSocket';
      };
    }

    audioBtn.addEventListener('click', async () => {
      audioBtn.disabled = true;
      try {
        if (audioOn) {
          const r = await fetch('/ghost/audio/off/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: SESSION_ID })
          });
          if (!r.ok) throw new Error(r.status);
          await stopAudio();
          statusEl.textContent = 'Звук выключен';
        } else {
          await startAudio();
        }
      } catch (e) {
        statusEl.textContent = 'Ошибка управления звуком';
        await stopAudio();
      } finally {
        audioBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

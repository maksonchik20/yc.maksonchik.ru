<script>
(function () {
  'use strict';

  var TEST_DURATION_MS = 60 * 60 * 1000;

  function pad2(value) {
    return String(value).padStart(2, '0');
  }

  function formatAdminDate(date) {
    return pad2(date.getDate()) + '.' + pad2(date.getMonth() + 1) + '.' + date.getFullYear();
  }

  function formatAdminTime(date) {
    return pad2(date.getHours()) + ':' + pad2(date.getMinutes());
  }

  function setSplitDateTime(fieldPrefix, date) {
    var dateInput = document.getElementById('id_' + fieldPrefix + '_0');
    var timeInput = document.getElementById('id_' + fieldPrefix + '_1');
    if (dateInput) {
      dateInput.value = formatAdminDate(date);
    }
    if (timeInput) {
      timeInput.value = formatAdminTime(date);
    }
  }

  function paymentInputForSelect(select) {
    if (!select || !select.form) {
      return null;
    }
    var name = select.name || '';
    if (name === 'token_type') {
      return select.form.querySelector('#id_payment_amount');
    }
    if (name.indexOf('-token_type') !== -1) {
      var prefix = name.slice(0, name.length - '-token_type'.length);
      return select.form.querySelector('#id_' + prefix + '-payment_amount');
    }
    return null;
  }

  function paymentContainerForInput(input) {
    if (!input) {
      return null;
    }
    return (
      input.closest('.form-group.field-payment_amount')
      || input.closest('.form-group')
      || input.closest('td.field-payment_amount')
      || input.closest('td')
    );
  }

  function applyTestSchedule(select) {
    if (!select || select.name !== 'token_type') {
      return;
    }
    var now = new Date();
    var end = new Date(now.getTime() + TEST_DURATION_MS);
    setSplitDateTime('starts_at', now);
    setSplitDateTime('expires_at', end);
  }

  window.ghostNoteToggleTokenType = function (select, applySchedule) {
    if (!select) {
      return;
    }
    var isTest = select.value === 'test';
    var paymentInput = paymentInputForSelect(select);
    var paymentGroup = paymentContainerForInput(paymentInput);

    if (paymentGroup) {
      paymentGroup.style.display = isTest ? 'none' : '';
    }
    if (paymentInput) {
      paymentInput.required = !isTest;
      paymentInput.disabled = isTest;
      if (isTest) {
        paymentInput.value = '';
      }
    }

    if (applySchedule && isTest) {
      applyTestSchedule(select);
    }
  };

  function initAll() {
    document.querySelectorAll('select[name="token_type"], select[name$="-token_type"]').forEach(function (select) {
      window.ghostNoteToggleTokenType(select, false);
    });
  }

  function bindSelect2() {
    if (!window.jQuery) {
      return;
    }
    window.jQuery(document).on(
      'change.ghostNoteTokenType select2:select.ghostNoteTokenType',
      'select[name="token_type"], select[name$="-token_type"]',
      function () {
        window.ghostNoteToggleTokenType(this, true);
      }
    );
    if (window.django && window.django.jQuery) {
      window.django.jQuery(document).on('formset:added', function () {
        window.setTimeout(initAll, 0);
      });
    }
  }

  initAll();
  bindSelect2();
})();
</script>

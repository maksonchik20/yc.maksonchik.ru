<script>
(function () {
  'use strict';

  function getCsrfToken() {
    var input = document.querySelector('input[name="csrfmiddlewaretoken"]');
    if (input && input.value) {
      return input.value;
    }
    var match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return match ? decodeURIComponent(match[1]) : '';
  }

  document.addEventListener('change', function (event) {
    var checkbox = event.target;
    if (!checkbox.matches('.ghost-commission-paid-toggle')) {
      return;
    }

    var url = checkbox.dataset.url;
    if (!url) {
      return;
    }

    var previous = !checkbox.checked;
    checkbox.disabled = true;

    var body = new URLSearchParams();
    body.set('is_paid', checkbox.checked ? '1' : '0');

    fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'X-CSRFToken': getCsrfToken(),
        'X-Requested-With': 'XMLHttpRequest',
      },
      body: body.toString(),
    })
      .then(function (response) {
        return response.json().then(function (data) {
          if (!response.ok || !data.ok) {
            throw new Error((data && data.error) || 'save_failed');
          }
          return data;
        });
      })
      .catch(function () {
        checkbox.checked = previous;
        window.alert('Не удалось сохранить статус выплаты. Попробуйте ещё раз.');
      })
      .finally(function () {
        checkbox.disabled = false;
      });
  });
})();
</script>
